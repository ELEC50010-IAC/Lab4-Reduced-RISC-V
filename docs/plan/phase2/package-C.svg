  <text x="365" y="298" class="sub" text-anchor="middle">line written, access completes</text>
  <text x="20" y="326" class="sub">Stores (write-through): send the write to main_mem; stall until it is accepted (decision D5, a 1-entry write buffer is the alternative).</text>
  <line x1="20" y1="346" x2="860" y2="346" stroke="#ccd" stroke-width="1"/>
  <text x="20" y="372" class="ttl2">branch_predictor.sv (Sat → Mon, then attach with A)</text>
  <text x="20" y="394" class="lblb">Direct-mapped BTB, ENTRIES = 16 (default)</text>
