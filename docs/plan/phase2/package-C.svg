  <text x="90.0" y="118" class="ttl" text-anchor="middle">MEM stage</text>
  <text x="90.0" y="132" class="sub" text-anchor="middle">A, WD, funct3,</text>
  <text x="90.0" y="145" class="sub" text-anchor="middle">MemRead, MemWrite</text>
  <rect x="212" y="96" width="150" height="58" rx="4" class="D"/>
  <text x="287.0" y="120" class="ttl" text-anchor="middle">Data cache core</text>
  <text x="287.0" y="134" class="sub" text-anchor="middle">tags, data, LRU (D)</text>
