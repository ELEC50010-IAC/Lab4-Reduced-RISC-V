  <rect width="1280" height="830" fill="#ffffff"/>
  <text x="56" y="28" style="font-size:18px;font-weight:bold;fill:#111">Package C · Memory side, pc_top, then branch predictor</text>
  <text x="56" y="46" class="sub">Cache pair (C + D) · C's work is tested by B · C writes the tests for A (hazard unit, hazard programs)</text>
  <circle cx="32" cy="30" r="15" fill="#2f6db5"/>
  <text x="32" y="35" class="bt">C</text>
  <text x="20" y="78" class="ttl2">Memory side (Wed → Fri, built with D)</text>
