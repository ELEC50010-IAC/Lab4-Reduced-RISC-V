  <rect x="20" y="444" width="40" height="20" fill="#fff" stroke="#2f6db5" stroke-width="1"/>
  <text x="40.0" y="458" class="lbl" text-anchor="middle">1</text>
  <rect x="60" y="444" width="50" height="20" fill="#fff" stroke="#2f6db5" stroke-width="1"/>
  <text x="85.0" y="458" class="lbl" text-anchor="middle">1</text>
  <rect x="110" y="444" width="80" height="20" fill="#fff" stroke="#2f6db5" stroke-width="1"/>
  <text x="150.0" y="458" class="lbl" text-anchor="middle">…</text>
  <rect x="190" y="444" width="100" height="20" fill="#fff" stroke="#2f6db5" stroke-width="1"/>
  <text x="240.0" y="458" class="lbl" text-anchor="middle">…</text>
  <rect x="290" y="444" width="60" height="20" fill="#fff" stroke="#2f6db5" stroke-width="1"/>
  <text x="320.0" y="458" class="lbl" text-anchor="middle">10</text>
  <rect x="20" y="464" width="40" height="20" fill="#fff" stroke="#2f6db5" stroke-width="1"/>
  <text x="40.0" y="478" class="lbl" text-anchor="middle">2</text>
  <rect x="60" y="464" width="50" height="20" fill="#fff" stroke="#2f6db5" stroke-width="1"/>
  <text x="85.0" y="478" class="lbl" text-anchor="middle">1</text>
  <rect x="110" y="464" width="80" height="20" fill="#fff" stroke="#2f6db5" stroke-width="1"/>
  <text x="150.0" y="478" class="lbl" text-anchor="middle">…</text>
  <rect x="190" y="464" width="100" height="20" fill="#fff" stroke="#2f6db5" stroke-width="1"/>
  <text x="240.0" y="478" class="lbl" text-anchor="middle">…</text>
  <rect x="290" y="464" width="60" height="20" fill="#fff" stroke="#2f6db5" stroke-width="1"/>
  <text x="320.0" y="478" class="lbl" text-anchor="middle">01</text>
  <rect x="20" y="484" width="40" height="20" fill="#fff" stroke="#2f6db5" stroke-width="1"/>
  <text x="40.0" y="498" class="lbl" text-anchor="middle">3</text>
  <rect x="60" y="484" width="50" height="20" fill="#fff" stroke="#2f6db5" stroke-width="1"/>
  <text x="85.0" y="498" class="lbl" text-anchor="middle">0</text>
  <rect x="110" y="484" width="80" height="20" fill="#fff" stroke="#2f6db5" stroke-width="1"/>
  <text x="150.0" y="498" class="lbl" text-anchor="middle"></text>
  <rect x="190" y="484" width="100" height="20" fill="#fff" stroke="#2f6db5" stroke-width="1"/>
  <text x="240.0" y="498" class="lbl" text-anchor="middle"></text>
  <rect x="290" y="484" width="60" height="20" fill="#fff" stroke="#2f6db5" stroke-width="1"/>
  <text x="320.0" y="498" class="lbl" text-anchor="middle"></text>
  <text x="20" y="520" class="sub">…  (ENTRIES rows)</text>
  <text x="20" y="546" class="mono">idx = PCF[5:2]          tag = PCF[31:6]</text>
  <text x="20" y="562" class="mono">hit = valid[idx] &amp; (tag[idx] == PCF[31:6])</text>
  <text x="20" y="578" class="mono">PredTakenF  = hit &amp; cnt[idx][1]</text>
  <text x="20" y="594" class="mono">PredTargetF = target[idx]</text>
  <text x="20" y="622" class="sub">Ports: PCF, UpdateEn, UpdatePC, UpdateTaken,</text>
  <text x="20" y="636" class="sub">UpdateTarget  →  PredTakenF, PredTargetF</text>
  <text x="20" y="650" class="sub">jalr is not predicted (UpdateEn = BranchE | JumpE).</text>
  <text x="450" y="394" class="lblb">2-bit counter per entry</text>
  <circle cx="480" cy="460" r="26" fill="#dbe9fb" stroke="#2f6db5" stroke-width="2"/>
  <text x="480" y="459" class="ttl2" text-anchor="middle">00</text>
  <text x="480" y="472" class="sub" text-anchor="middle">NT</text>
  <text x="480" y="506" class="sub" text-anchor="middle">strongly</text>
  <text x="480" y="518" class="sub" text-anchor="middle">not taken</text>
  <circle cx="590" cy="460" r="26" fill="#dbe9fb" stroke="#2f6db5" stroke-width="2"/>
  <text x="590" y="459" class="ttl2" text-anchor="middle">01</text>
  <text x="590" y="472" class="sub" text-anchor="middle">NT</text>
  <text x="590" y="506" class="sub" text-anchor="middle">weakly</text>
  <text x="590" y="518" class="sub" text-anchor="middle">not taken</text>
  <circle cx="700" cy="460" r="26" fill="#dbe9fb" stroke="#2f6db5" stroke-width="2"/>
  <text x="700" y="459" class="ttl2" text-anchor="middle">10</text>
  <text x="700" y="472" class="sub" text-anchor="middle">T</text>
  <text x="700" y="506" class="sub" text-anchor="middle">weakly</text>
  <text x="700" y="518" class="sub" text-anchor="middle">taken</text>
  <circle cx="810" cy="460" r="26" fill="#dbe9fb" stroke="#2f6db5" stroke-width="2"/>
  <text x="810" y="459" class="ttl2" text-anchor="middle">11</text>
  <text x="810" y="472" class="sub" text-anchor="middle">T</text>
  <text x="810" y="506" class="sub" text-anchor="middle">strongly</text>
  <text x="810" y="518" class="sub" text-anchor="middle">taken</text>
  <path d="M505,452 L565,452" class="w" marker-end="url(#arr)"/>
  <path d="M565,468 L505,468" class="w" marker-end="url(#arr)"/>
  <text x="535.0" y="446" class="sub" text-anchor="middle">taken</text>
  <text x="535.0" y="486" class="sub" text-anchor="middle">not taken</text>
  <path d="M615,452 L675,452" class="w" marker-end="url(#arr)"/>
  <path d="M675,468 L615,468" class="w" marker-end="url(#arr)"/>
  <text x="645.0" y="446" class="sub" text-anchor="middle">taken</text>
  <text x="645.0" y="486" class="sub" text-anchor="middle">not taken</text>
  <path d="M725,452 L785,452" class="w" marker-end="url(#arr)"/>
  <path d="M785,468 L725,468" class="w" marker-end="url(#arr)"/>
  <text x="755.0" y="446" class="sub" text-anchor="middle">taken</text>
  <text x="755.0" y="486" class="sub" text-anchor="middle">not taken</text>
  <text x="450" y="556" class="lbl">On UpdateEn and a hit: counter moves one step</text>
  <text x="450" y="571" class="lbl">towards taken or not taken (saturates).</text>
  <text x="450" y="586" class="lbl">Miss and taken: allocate the entry with</text>
  <text x="450" y="601" class="lbl">counter = 10 (weakly taken).</text>
  <text x="450" y="616" class="lbl">Predict taken only when counter is 10 or 11.</text>
  <text x="450" y="631" class="lbl">Stub first: PredTakenF = 0 (predict not taken),</text>
  <text x="450" y="646" class="lbl">so the pipeline can be finished without it.</text>
  <line x1="20" y1="684" x2="860" y2="684" stroke="#ccd" stroke-width="1"/>
  <text x="20" y="706" class="ttl2">pc_top.sv rework (Wed → Thu, tested by B)</text>
  <rect x="20" y="716" width="410" height="100" rx="6" fill="#ffffff" stroke="#2f6db5" stroke-width="1.6"/>
  <rect x="20" y="716" width="410" height="22" rx="6" fill="#dbe9fb"/>
  <rect x="20" y="728" width="410" height="10" fill="#dbe9fb"/>
  <text x="30" y="732" class="ttl2">New ports</text>
  <text x="30" y="750" class="lbl">in: clk, rst (reset 0xBFC00000), en (= ~StallF, PC holds when 0),</text>
  <text x="30" y="765" class="lbl">     Mispredict, RedirectPC [32], PredTaken, PredTarget [32]</text>
  <text x="30" y="780" class="lbl">out: PC, PCPlus4</text>
  <rect x="440" y="716" width="420" height="100" rx="6" fill="#ffffff" stroke="#2f6db5" stroke-width="1.6"/>
  <rect x="440" y="716" width="420" height="22" rx="6" fill="#dbe9fb"/>
  <rect x="440" y="728" width="420" height="10" fill="#dbe9fb"/>
  <text x="450" y="732" class="ttl2">Removed</text>
  <text x="450" y="750" class="lbl">PCSrc, ImmExt, ALUResult, PCTarget: the PCTargetE adder</text>
  <text x="450" y="765" class="lbl">moves to EX (B) and the jalr target joins RedirectPCE.</text>
  <text x="450" y="780" class="lbl">Next PC: Mispredict, then PredTaken, else PCPlus4.</text>
  <text x="910" y="76" class="lblb">Where it sits</text>
  <rect x="910" y="84" width="40" height="52" rx="3" fill="#f1f3f6" stroke="#c9ced6"/>
  <text x="930" y="147" class="sub" text-anchor="middle">IF</text>
  <rect x="956" y="84" width="40" height="52" rx="3" fill="#f1f3f6" stroke="#c9ced6"/>
  <text x="976" y="147" class="sub" text-anchor="middle">ID</text>
  <rect x="1002" y="84" width="40" height="52" rx="3" fill="#f1f3f6" stroke="#c9ced6"/>
  <text x="1022" y="147" class="sub" text-anchor="middle">EX</text>
  <rect x="1048" y="84" width="40" height="52" rx="3" fill="#f1f3f6" stroke="#c9ced6"/>
  <text x="1068" y="147" class="sub" text-anchor="middle">MEM</text>
  <rect x="1094" y="84" width="40" height="52" rx="3" fill="#f1f3f6" stroke="#c9ced6"/>
  <text x="1114" y="147" class="sub" text-anchor="middle">WB</text>
  <rect x="914" y="88" width="32" height="14" rx="2" fill="#2f6db5" opacity="0.85"/>
  <rect x="914" y="108" width="32" height="14" rx="2" fill="#2f6db5" opacity="0.85"/>
  <rect x="1052" y="114" width="32" height="14" rx="2" fill="#2f6db5" opacity="0.85"/>
  <rect x="900" y="176" width="360" height="533" rx="8" fill="#fbfbfb" stroke="#2f6db5" stroke-width="1.6"/>
  <rect x="910" y="185" width="340" height="22" rx="4" fill="#dbe9fb"/>
  <text x="918" y="200" class="ttl2">You build</text>
  <text x="918" y="222" class="lblb">1.</text>
  <text x="936" y="222" class="lbl">main_mem.sv: LATENCY parameter, 16-byte line reads,</text>
  <text x="936" y="237" class="lbl">writes, data.hex preload at 0x10000</text>
  <text x="918" y="252" class="lblb">2.</text>
  <text x="936" y="252" class="lbl">Refill controller with D (miss → fill → MemBusy)</text>
  <text x="918" y="267" class="lblb">3.</text>
  <text x="936" y="267" class="lbl">pc_top.sv rework: enable, 3-way next PC</text>
  <text x="918" y="282" class="lblb">4.</text>
  <text x="936" y="282" class="lbl">branch_predictor.sv: 16-entry BTB + 2-bit counters,</text>
  <text x="936" y="297" class="lbl">a stub with PredTakenF = 0 first</text>
  <text x="918" y="312" class="sub">Mon 30 → Wed 2: attach the predictor with A;</text>
  <text x="918" y="327" class="sub">sweep ENTRIES for the evidence</text>
  <rect x="910" y="339" width="340" height="22" rx="4" fill="#dbe9fb"/>
  <text x="918" y="354" class="ttl2">Done when</text>
  <text x="918" y="376" class="lbl">•</text>
  <text x="934" y="376" class="lbl">main_mem, pc_top and predictor tests pass</text>
  <text x="936" y="391" class="lbl">(B writes them)</text>
  <text x="918" y="406" class="lbl">•</text>
  <text x="934" y="406" class="lbl">loop benchmark: fewer cycles than predict-not-taken</text>
  <text x="918" y="421" class="lbl">•</text>
  <text x="934" y="421" class="lbl">all 42 tests still pass with the predictor on</text>
  <rect x="910" y="433" width="340" height="22" rx="4" fill="#dbe9fb"/>
  <text x="918" y="448" class="ttl2">You write the tests for A</text>
  <text x="918" y="470" class="lbl">•</text>
  <text x="934" y="470" class="lbl">hazard_unit_tb: forward, load-use, flush, memory</text>
  <text x="936" y="485" class="lbl">stall, and the priority order</text>
  <text x="918" y="500" class="lbl">•</text>
  <text x="934" y="500" class="lbl">asm/hazard_*.s run by tests/top-hazards_tb.cpp:</text>
  <text x="936" y="515" class="lbl">back-to-back, 2 apart, load-use, load then store,</text>
  <text x="936" y="530" class="lbl">ALU then bne, load then bne, shadow of a taken</text>
  <text x="936" y="545" class="lbl">branch, jal / jalr flush, writes to x0</text>
  <rect x="910" y="557" width="340" height="22" rx="4" fill="#dbe9fb"/>
  <text x="918" y="572" class="ttl2">Talks to</text>
  <text x="918" y="594" class="lbl">•</text>
  <text x="934" y="594" class="lbl">D: refill interface (agree on Wed 25)</text>
  <text x="918" y="609" class="lbl">•</text>
  <text x="934" y="609" class="lbl">A: MispredictE, Update*, Pred* slots</text>
  <text x="918" y="624" class="lbl">•</text>
  <text x="934" y="624" class="lbl">B: pc_top ports, Pred* in IF/ID and ID/EX</text>
