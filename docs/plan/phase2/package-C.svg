  <text x="606" y="148" class="sub">line</text>
  <text x="20" y="176" class="sub">Signals between cache core and controller (miss, missAddr, fillEn, fillWay, fillLine) and between controller and main_mem</text>
  <text x="20" y="190" class="sub">(req, we, addr, wdata, ready, rline) are proposals: agree the exact names with D on Wed 25 and add them to interfaces.md.</text>
  <text x="20" y="220" class="lblb">Refill controller states</text>
  <rect x="20" y="234" width="150" height="46" rx="4" class="C"/>
  <text x="95.0" y="254" class="ttl2" text-anchor="middle">IDLE</text>
  <text x="95.0" y="268" class="sub" text-anchor="middle">MemBusy = 0</text>
  <rect x="200" y="234" width="150" height="46" rx="4" class="C"/>
  <text x="275.0" y="254" class="ttl2" text-anchor="middle">REQUEST</text>
  <text x="275.0" y="268" class="sub" text-anchor="middle">MemBusy = 1</text>
  <rect x="380" y="234" width="150" height="46" rx="4" class="C"/>
  <text x="455.0" y="254" class="ttl2" text-anchor="middle">WAIT</text>
  <text x="455.0" y="268" class="sub" text-anchor="middle">count LATENCY cycles</text>
  <rect x="560" y="234" width="150" height="46" rx="4" class="C"/>
  <text x="635.0" y="254" class="ttl2" text-anchor="middle">FILL</text>
  <text x="635.0" y="268" class="sub" text-anchor="middle">write line, update LRU</text>
